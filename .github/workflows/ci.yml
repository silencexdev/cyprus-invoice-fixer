name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        working-directory: backend
        run: dotnet restore CyprusInvoiceFixer.sln

      - name: Build solution
        working-directory: backend
        run: dotnet build CyprusInvoiceFixer.sln --no-restore -c Release

      - name: Test
        working-directory: backend
        run: dotnet test CyprusInvoiceFixer.sln --no-build -c Release --verbosity normal
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build
